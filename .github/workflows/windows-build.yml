name: Build OpenBoard for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download OpenBoard source
        uses: actions/checkout@v4

      - name: Prepare MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtmultimedia qtwebchannel qtpositioning qt5compat'

      - name: Download third-party libraries
        shell: pwsh
        run: |
          git clone https://github.com/OpenBoard-org/OpenBoard-ThirdParty.git ../OpenBoard-ThirdParty

      - name: Build QuaZip library
        shell: pwsh
        run: |
          $project = "../OpenBoard-ThirdParty/quazip/quazip.pro"

          if (!(Test-Path $project)) {
            Write-Error "QuaZip project file was not found."
            exit 1
          }

          Push-Location "../OpenBoard-ThirdParty/quazip"
          qmake quazip.pro

          if ($LASTEXITCODE -ne 0) {
            throw "QuaZip qmake failed."
          }

          nmake

          if ($LASTEXITCODE -ne 0) {
            throw "QuaZip build failed."
          }

          Pop-Location

      - name: Build OpenBoard
        shell: pwsh
        run: |
          qmake OpenBoard.pro

          if ($LASTEXITCODE -ne 0) {
            throw "OpenBoard qmake failed."
          }

          nmake

          if ($LASTEXITCODE -ne 0) {
            throw "OpenBoard build failed."
          }

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: OpenBoard-Windows
          path: build/win32/release/product/
          if-no-files-found: error
